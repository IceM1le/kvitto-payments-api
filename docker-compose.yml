services:
  db:
    image: postgres:16
    container_name: kvitto-db

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: kvitto

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kvitto"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .

    container_name: kvitto-api

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/kvitto
      WEBHOOK_SECRET: dev-secret-in-docker

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app/app

volumes:
  postgres_data: