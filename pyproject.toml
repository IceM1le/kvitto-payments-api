[project]
name = "kvitto-payments"
version = "0.1.0"
description = "Test task for Junior Python Developer (FastAPI)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.9",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "alembic>=1.16.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.28.1",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"